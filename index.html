<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥냥 유전 하우스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=fixed-pen-button">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","./js/ui.js":"./js/ui.js?v=capacity-2","./js/world.js":"./js/world.js?v=capacity-2","./js/game.js":"./js/game.js?v=capacity-2","./js/params.js":"./js/params.js?v=capacity-2","./js/next-step.js":"./js/next-step.js?v=capacity-2"}}</script>
</head>
<body>
<canvas id="world"></canvas>
<button id="worldPenUpgrade" data-act="upgradepen" hidden></button>
<header id="top">
  <div class="brand"><span class="paw">🐾</span> 냥냥 유전 하우스 <small>prototype</small></div>
  <div class="clock" id="clock"></div>
  <div class="top-right">
    <button class="pill sound" id="btnSound" aria-label="소리 켜기" aria-pressed="false" title="소리 켜기">🔇</button>
    <button class="pill income" id="btnIncome">🐾 수입 받기 <b id="incomeAmt">0</b></button>
    <div class="pill coins">🐾 <b id="coins">0</b></div>
    <div class="dev" hidden><button class="mini" data-dev="1h">+1시간</button><button class="mini" data-dev="1d">+1일</button><button class="mini warn" data-dev="reset">새 게임</button></div>
  </div>
</header>
<div id="hint">🕹️ WASD·방향키 또는 클릭으로 이동 · 고양이를 클릭하면 돌보기 · 🛍️동물샵 / 💞교배집 / 이웃 우리에 다가가 보세요</div>
<aside id="panel" hidden></aside>
<div id="watchingCat" hidden><span id="watchingLabel"></span><button id="returnCamera" class="btn sm gray">집사에게 돌아가기</button><small>화면을 드래그하면 회전해요</small></div>
<div id="fxLayer"></div>
<div id="touchStick" aria-label="터치 이동 조이스틱"><span class="stick-knob"></span><span class="stick-caption">이동</span></div>
<nav id="tabs">
  <button data-tab="home"><span>🐱</span>내 고양이</button>
  <button data-tab="breed" hidden><span>💞</span>교배</button>
  <button data-tab="shop" hidden><span>🛍️</span>동물샵</button>
  <button data-tab="npc" hidden><span>🏘️</span>이웃</button>
  <button data-tab="dex" hidden><span>📖</span>도감</button>
  <button data-act="mapguide"><span>🧭</span>지도</button>
</nav>
<div id="journey" hidden><span id="journeyLabel"></span><button class="btn sm gray" data-act="canceljourney">이동 취소</button></div>
<div id="breedOverlay" role="dialog" aria-modal="true" aria-label="새 가족 탄생 연출" hidden><canvas id="breedCanvas"></canvas><div class="cap">두근두근… 💞</div><button id="skipBreed" class="btn gray">연출 건너뛰기</button></div>
<div id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="modal" hidden></div>
<input type="file" id="saveFile" accept="application/json,.json" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
