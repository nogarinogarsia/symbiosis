<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유전 실험실 · 냥냥 유전 하우스</title>
  <link rel="stylesheet" href="css/lab.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <header><a href="index.html">🐾 냥냥 유전 하우스</a><a href="tests.html">유전 엔진 검사 ↗</a></header>
  <main>
    <div class="intro"><span class="eyebrow">CAT GENETICS LAB</span><h1>어떤 아기가 태어날까요?</h1><p>부모의 숨은 유전자를 바꾸고, 같은 seed로 결과를 다시 확인해 보세요.</p><p class="muted">게임 진행에는 영향을 주지 않는 실험 공간이에요. 실제 유전학을 단순화한 게임 모델을 사용합니다.</p></div>
    <section class="controls" aria-label="실험 설정">
      <label>실험 seed<input id="seed" value="nyang-lab-2026" maxlength="120" autocomplete="off"></label>
      <label>교배 횟수<select id="count"><option value="100">100회 · 빠르게</option><option value="1000" selected>1,000회 · 기본</option><option value="10000">10,000회 · 정밀하게</option></select></label>
      <button id="randomize">이 seed로 부모 생성</button>
      <button id="run" class="primary">🧬 교배 실험 시작</button>
      <button id="cancel" hidden>실험 중지</button>
    </section>
    <section class="presets" aria-label="유전 예제"><span>예제</span><button data-preset="dilute">희석 Dd × Dd</button><button data-preset="long">장모 Ll × Ll</button><button data-preset="orange">X연관 오렌지</button><button data-preset="mink">밍크 cb × cs</button></section>
    <div class="parents"><section id="father" aria-label="아빠 유전자"></section><section id="mother" aria-label="엄마 유전자"></section></div>
    <div class="file-controls"><button id="export">💾 실험 설정 저장</button><button id="import">📂 설정 불러오기</button><input type="file" id="experimentFile" accept="application/json,.json" hidden><span class="muted">seed·부모 유전자·횟수를 JSON 파일로 보관합니다.</span></div>
    <p id="status" role="status" aria-live="polite">부모 유전자를 선택하거나 예제를 골라 보세요.</p>
    <progress id="progress" max="100" value="0" hidden aria-label="교배 실험 진행률"></progress>
    <section id="results" aria-label="교배 통계" hidden></section>
    <footer>성격은 돌봄으로 결정되므로 이 실험에는 포함하지 않습니다. SPECIAL·판타지·의상은 게임 규칙에 따라 별도로 추첨합니다.</footer>
  </main>
  <script type="module" src="js/lab.js"></script>
</body>
</html>
